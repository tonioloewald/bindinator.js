<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>b8r-tjs demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
    h1 { margin-bottom: 0; }
    p { color: #555; }
    #app { margin: 1rem 0; }
    button.add { font: inherit; cursor: pointer; }
  </style>
  <!-- the framework is loaded as plain ES modules — no bundler -->
  <script type="importmap">
    {
      "imports": {
        "b8r-tjs": "../dist/b8r.js",
        "tosijs": "./vendor/tosijs.js"
      }
    }
  </script>
</head>
<body>
  <h1>b8r-tjs</h1>
  <p>
    A <strong>b8r component</strong> running on tosijs: element-creator view,
    CSS-variable styling, behaviour bound by path (<code>_component_.inc</code>),
    bindings as wiring. Click to update only the wired node; each instance is
    independent.
  </p>
  <div id="app"></div>
  <button class="add" id="more">+ mount another instance</button>

  <script type="module">
    import { defineB8rComponent, mountB8rComponent } from 'b8r-tjs'

    defineB8rComponent('counter', {
      css: `
        ._component_ .counter {
          display: inline-flex; align-items: center; gap: 12px;
          padding: 8px 14px; border: 1px solid #ccc; border-radius: 10px;
        }
        ._component_ button {
          font: inherit; cursor: pointer; width: 2em; height: 2em;
          border-radius: 50%; border: 1px solid #999;
        }
        ._component_ .n {
          min-width: 3ch; text-align: center; font-weight: bold; font-size: 1.25rem;
        }
      `,
      view: ({ div, span, button }) => div(
        { class: 'counter' },
        button('−', { onClick: '_component_.dec' }),
        span({ class: 'n', bindText: '_component_.count' }),
        button('+', { onClick: '_component_.inc' })
      ),
      initialValue: ({ component }) => ({
        count: 0,
        inc () { component.data.count = component.data.count + 1 },
        dec () { component.data.count = component.data.count - 1 }
      })
    })

    const app = document.querySelector('#app')
    await mountB8rComponent(app, 'counter')

    document.querySelector('#more').addEventListener('click', async () => {
      const host = document.createElement('div')
      app.after(host)
      await mountB8rComponent(host, 'counter')
    })

    window.b8rTjsReady = true
  </script>
</body>
</html>
