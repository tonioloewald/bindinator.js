<div class="info"></div>
<b8r-component path="../components/component-editor.js"></b8r-component>
<script>
/* global b8r, get, findOne */
  const {md} = await import('../lib/text-render.js');
  const editor = findOne('b8r-component')
  const info = findOne('.info');
  b8r.component('./path-browser');
  b8r.component(get().url, undefined, true).then(c => {
    let docs_md;
    // v1 (.component.html) components preserve their source; v2 (.js) ones do not
    if (c._source && c._source.indexOf('<!--') === 0) {
      [docs_md] = c._source.substr(4).split('-->');
    } else {
      docs_md = `# ${get().url}`;
    }
    md({elt: info, source: docs_md});
    editor.ready().then(() => {
      if (c._source) {
        editor.data.loadSource(c._source, 'auto', get().url)
      } else {
        // v2 component: render it directly (editing v2 in-place is a TODO)
        editor.data.previewComponent(c)
      }
    })
  });
</script>
